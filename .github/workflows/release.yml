name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v2.1*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Lint step removed per request to skip linting in CI
      # - name: Run ESLint
      #   run: npm run lint

      # TypeScript verification step removed to skip type-checking in CI
      # - name: Run TypeScript Verification
      #   run: npx tsc --noEmit

      - name: Verify Production Next.js Build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm run build

  release:
    name: Build & Package Electron Installer
    needs: test
    if: startsWith(github.ref, 'refs/tags/v2.1')
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Rebuild Native Dependencies (better-sqlite3)
        run: npx electron-builder install-app-dep

      - name: Build Next.js Static/Standalone Files
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }} 
        run: npm run build

      - name: Build and Publish Windows Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
